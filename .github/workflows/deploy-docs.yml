name: 部署到 GitHub Pages

on:
  push:
    branches: [master]
  # 手动触发，方便 Pages 刚开启后重跑一次
  workflow_dispatch:

# 全局只给最小权限：
# build  job 只要读代码；
# deploy job 需要额外 pages: write + id-token: write（单独加在 job 上）。
permissions:
  contents: read

concurrency:
  # 同一时刻只允许一个 Pages 部署；不取消进行中的部署，避免发布到一半被打断
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # “最近更新时间” 等 git 历史信息需要完整提交记录
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 不指定 version：pnpm 版本统一由 package.json 的 packageManager 字段决定，
          # 同时指定两者会触发 "Multiple versions of pnpm specified"
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 与 package.json 的 volta.node / .npmrc use-node-version 保持一致
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 读取 Pages 站点信息，产出 base_path / origin。
      #
      # 默认情况：仓库已经开启 Pages（Settings → Pages → Source → GitHub Actions），
      # 这一步直接读出站点信息。
      #
      # 如果还没开启，configure-pages 会报 "Get Pages site failed"。
      # 两种解法：
      #   1) 手动开一次（推荐）：Settings → Pages → Build and deployment →
      #      Source 选 “GitHub Actions”，之后就不需要再管了；
      #   2) 给仓库加一个 secret PAGES_PAT（PAT 需要 repo 或 pages:write 权限），
      #      下面的 enablement 会自动把 Pages 开起来。
      #      注意：GITHUB_TOKEN 没有开启 Pages 的权限，所以不能用它。
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: ${{ secrets.PAGES_PAT != '' }}
          token: ${{ secrets.PAGES_PAT != '' && secrets.PAGES_PAT || github.token }}

      - name: Build VuePress site
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          # 项目型 Pages 站点路径形如 /notes（用户型站点为空串）。
          # VuePress 的 base 需要以斜杠结尾，这里在脚本里补齐。
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
          # 站点主域名（不含路径），用于 canonical / og:url / RSS / sitemap
          DOCS_HOSTNAME: ${{ steps.pages.outputs.origin }}
        run: |
          export DOCS_BASE="${DOCS_BASE%/}/"
          echo "base     = $DOCS_BASE"
          echo "hostname = $DOCS_HOSTNAME"
          pnpm docs:build

      - name: 准备产物
        run: |
          # 关闭 Jekyll 处理：仓库里如果有 _ 开头的目录/文件，没有 .nojekyll 会被忽略
          touch src/.vuepress/dist/.nojekyll
          # GitHub Pages 要求产物对 “Others” 可读，否则部署时报 deployment_perms_error
          chmod -c -R +rX src/.vuepress/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # artifact 名必须是 github-pages（deploy-pages 的默认值）
          path: src/.vuepress/dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 创建 Pages 部署需要 pages: write
      pages: write
      # 换取 OIDC JWT 需要 id-token: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
