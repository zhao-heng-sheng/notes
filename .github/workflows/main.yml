name: notes

on:
  # 每当 push 到 master 分支时触发部署
  push:
    branches: [master]
  # 手动触发部署
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 这里不要写 version：pnpm 版本统一由 package.json 的 packageManager 字段决定。
          # 同时指定两者会冲突，action 直接报
          # "Multiple versions of pnpm specified" 而失败。
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 与 package.json 的 volta.node / .npmrc use-node-version 保持一致
          # （vuepress v2 rc / theme-hope v2 要求 node >= 20.19）
          node-version: 24.19.0
          # 缓存 pnpm 依赖
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 运行构建脚本
      - name: Build VuePress site
        run: pnpm docs:build

      # 查看 workflow 的文档来获取更多信息
      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: Deploy to to server
        uses: wlixcc/SFTP-Deploy-Action@v1.0
        with:
          username: 'root'   #ssh user name
          server: '118.195.232.109' #引用之前创建好的secret
          ssh_private_key: ${{ secrets.SSH_KEY }} #引用之前创建好的secret
          local_path: './src/.vuepress/dist'  # 对应我们项目build的文件夹路径
          remote_path: '/www/wwwroot/notes'
