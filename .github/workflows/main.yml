name: notes

on:
  # 每当 push 到 master 分支时触发部署
  push:
    branches: [master]
  # 手动触发部署
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 这里不要写 version：pnpm 版本统一由 package.json 的 packageManager 字段决定。
          # 同时指定两者会冲突，action 直接报
          # "Multiple versions of pnpm specified" 而失败。
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 与 package.json 的 volta.node / .npmrc use-node-version 保持一致
          # （vuepress v2 rc / theme-hope v2 要求 node >= 20.19）
          node-version: 24.19.0
          # 缓存 pnpm 依赖
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 运行构建脚本
      - name: Build VuePress site
        run: pnpm docs:build

      # 部署到服务器
      #
      # 这里不用 wlixcc/SFTP-Deploy-Action：它是基于 alpine:3.10（早已 EOL）的
      # Docker 容器 action，容器型 action 正在被 GitHub 弃用，且旧版 OpenSSH
      # 客户端与服务端新版的算法协商容易出问题。
      # 改为直接用 runner 自带的 OpenSSH 客户端，行为可预期，报错也直接出现在日志里。
      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_HOST: '118.195.232.109'
          DEPLOY_PORT: '22'
          DEPLOY_USER: 'root'
          DEPLOY_PATH: '/www/wwwroot/notes'
        run: |
          set -uo pipefail

          key_file="$RUNNER_TEMP/deploy_key.pem"
          known_hosts="$RUNNER_TEMP/known_hosts"
          batch_file="$RUNNER_TEMP/sftp_batch.txt"

          # GitHub secret 里私钥常被存成字面量 \n，这里还原成真实换行
          printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          : > "$known_hosts"

          # 与原 action 保持一致：把 dist 目录里的内容同步到站点根目录
          printf 'put -r ./src/.vuepress/dist %s\n' "$DEPLOY_PATH" > "$batch_file"

          file_count=$(find ./src/.vuepress/dist -type f | wc -l)

          {
            echo "### 部署诊断"
            echo
            echo "- 目标: \`$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT:$DEPLOY_PATH\`"
            echo "- 待上传文件数: $file_count"
            echo "- 私钥字节数: $(wc -c < "$key_file")"
            echo "- 私钥首行: $(head -n 1 "$key_file")"
            echo
            echo '```'
            timeout 90 ssh -vv -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" \
              -i "$key_file" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" true 2>&1 \
              | grep -v -E '^(debug1: (Local version|Remote protocol|id_rsa|ssh2|cipher|kex|host key algorithm|server host key|SSH2_MSG_KEXINIT sent|expecting SSH2_MSG_KEXINIT))' \
              | tail -n 30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          sftp -b "$batch_file" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -i "$key_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" 2>&1 | tee "$RUNNER_TEMP/sftp.log"

          status=${PIPESTATUS[0]}

          {
            echo '```'
            tail -n 30 "$RUNNER_TEMP/sftp.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "sftp exit code: $status"
          exit $status
