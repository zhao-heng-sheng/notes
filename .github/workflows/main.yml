name: notes

on:
  # 每当 push 到 master 分支时触发部署
  push:
    branches: [master]
  # 手动触发部署
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 部署失败时把诊断结果写成独立 check run，便于在提交页直接查看
      checks: write

    steps:
      - uses: actions/checkout@v7
        with:
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 这里不要写 version：pnpm 版本统一由 package.json 的 packageManager 字段决定。
          # 同时指定两者会冲突，action 直接报
          # "Multiple versions of pnpm specified" 而失败。
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 与 package.json 的 volta.node / .npmrc use-node-version 保持一致
          # （vuepress v2 rc / theme-hope v2 要求 node >= 20.19）
          node-version: 24.19.0
          # 缓存 pnpm 依赖
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 运行构建脚本
      - name: Build VuePress site
        run: pnpm docs:build

      # 部署到服务器
      #
      # 这里不用 wlixcc/SFTP-Deploy-Action：它是基于 alpine:3.10（早已 EOL）的
      # Docker 容器 action，容器型 action 正在被 GitHub 弃用，且旧版 OpenSSH
      # 客户端与服务端新版的算法协商容易出问题。
      # 改为直接用 runner 自带的 OpenSSH 客户端，行为可预期，报错也直接出现在日志里。
      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: '118.195.232.109'
          DEPLOY_PORT: '22'
          DEPLOY_USER: 'root'
          DEPLOY_PATH: '/www/wwwroot/notes'
        run: |
          set -uo pipefail

          key_file="$RUNNER_TEMP/deploy_key.pem"
          known_hosts="$RUNNER_TEMP/known_hosts"
          batch_file="$RUNNER_TEMP/sftp_batch.txt"

          # GitHub secret 里私钥常被存成字面量 \n，这里还原成真实换行
          printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          : > "$known_hosts"

          # 与原 action 保持一致：把 dist 目录里的内容同步到站点根目录
          printf 'put -r ./src/.vuepress/dist %s\n' "$DEPLOY_PATH" > "$batch_file"

          file_count=$(find ./src/.vuepress/dist -type f | wc -l)
          key_bytes=$(wc -c < "$key_file")
          key_head=$(head -n 1 "$key_file")

          # ---- 诊断：TCP 连通性 ----
          if timeout 20 bash -c "exec 3<>/dev/tcp/$DEPLOY_HOST/$DEPLOY_PORT" 2>/dev/null; then
            tcp_result="TCP_OK"
          else
            tcp_result="TCP_FAIL"
          fi

          # ---- 诊断：ssh 连接过程 ----
          ssh_diag=$(timeout 60 ssh -vv -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" \
            -i "$key_file" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" true 2>&1 | tail -n 30)

          # ---- 实际部署 ----
          sftp -b "$batch_file" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -i "$key_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" 2>&1 | tee "$RUNNER_TEMP/sftp.log"

          status=${PIPESTATUS[0]}

          # ---- 诊断汇总 ----
          # 未登录 GitHub 看不到 Actions 日志，所以把诊断结果写成一个独立的
          # check run，挂在本次提交上，公开仓库可直接通过 API / 提交页读取。
          diag_summary="host=${DEPLOY_HOST}:${DEPLOY_PORT} tcp=${tcp_result} files=${file_count} key=${key_bytes}B sftp_exit=${status}"
          diag_text=$(printf '### 环境\n\n- 目标: `%s@%s:%s:%s`\n- TCP: %s\n- 文件数: %s\n- 私钥: %s 字节，首行 `%s`\n- sftp 退出码: %s\n\n### SSH 连接过程\n\n```\n%s\n```\n\n### SFTP 输出\n\n```\n%s\n```\n' \
            "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PATH" \
            "$tcp_result" "$file_count" "$key_bytes" "$key_head" "$status" \
            "$ssh_diag" "$(tail -n 40 "$RUNNER_TEMP/sftp.log")")

          {
            echo "### 部署诊断"
            echo
            echo "$diag_text"
          } >> "$GITHUB_STEP_SUMMARY"

          jq -n \
            --arg title "部署诊断" \
            --arg summary "$diag_summary" \
            --arg text "$diag_text" \
            --arg sha "$GITHUB_SHA" \
            '{name:$title, head_sha:$sha, status:"completed", conclusion:"failure", output:{title:$title, summary:$summary, text:$text}}' \
            > "$RUNNER_TEMP/diag.json"

          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" \
            --data-binary "@$RUNNER_TEMP/diag.json" || true

          echo "sftp exit code: $status"
          exit $status
