name: notes

on:
  # 每当 push 到 master 分支时触发部署
  push:
    branches: [master]
  # 手动触发部署
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 部署失败时把诊断结果写成独立 check run，便于在提交页直接查看
      checks: write

    steps:
      - uses: actions/checkout@v7
        with:
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 这里不要写 version：pnpm 版本统一由 package.json 的 packageManager 字段决定。
          # 同时指定两者会冲突，action 直接报
          # "Multiple versions of pnpm specified" 而失败。
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 与 package.json 的 volta.node / .npmrc use-node-version 保持一致
          # （vuepress v2 rc / theme-hope v2 要求 node >= 20.19）
          node-version: 24.19.0
          # 缓存 pnpm 依赖
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 运行构建脚本
      - name: Build VuePress site
        run: pnpm docs:build

      # 部署到服务器
      #
      # 这里不用 wlixcc/SFTP-Deploy-Action：它是基于 alpine:3.10（早已 EOL）的
      # Docker 容器 action，容器型 action 正在被 GitHub 弃用，且旧版 OpenSSH
      # 客户端与服务端新版的算法协商容易出问题。
      # 改为直接用 runner 自带的 OpenSSH 客户端，行为可预期，报错也直接出现在日志里。
      #
      # continue-on-error: 当前服务器 118.195.232.109 公网端口不可达，
      # 这条部署一定会失败，但不该把整个 workflow 拉红 ——
      # 站点现在的发布通道是 GitHub Pages（见 deploy-docs.yml）。
      # 服务器恢复后把 continue-on-error 去掉即可重新变严格。
      - name: Deploy to server
        id: deploy
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: '118.195.232.109'
          # 端口可以用仓库变量 DEPLOY_PORT 覆盖，不用改代码
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: 'root'
          DEPLOY_PATH: '/www/wwwroot/notes'
        run: |
          set -uo pipefail

          key_file="$RUNNER_TEMP/deploy_key.pem"
          known_hosts="$RUNNER_TEMP/known_hosts"
          batch_file="$RUNNER_TEMP/sftp_batch.txt"
          diag_file="$RUNNER_TEMP/deploy-diagnostic.log"

          # 从第一步起就把全部输出同时写进诊断文件，
          # 无论脚本在哪一步退出，文件都一定存在
          : > "$diag_file"
          exec > >(tee -a "$diag_file") 2>&1
          trap 'echo "### 脚本退出码: $?" >> "$diag_file"' EXIT

          echo "### 部署开始 $(date -Is)"
          echo "- 目标: $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT:$DEPLOY_PATH"
          echo "- runner 工具: jq=$(command -v jq || echo NO) curl=$(command -v curl || echo NO) ssh=$(command -v ssh || echo NO) sftp=$(command -v sftp || echo NO)"

          # 立即在 workspace 留一份，后续任何一步失败都不会丢
          cp "$diag_file" "$GITHUB_WORKSPACE/deploy-diagnostic.log" 2>/dev/null || true

          # GitHub secret 里私钥常被存成字面量 \n，这里还原成真实换行
          printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          : > "$known_hosts"

          echo "- 私钥: $(wc -c < "$key_file") 字节，首行 $(head -n 1 "$key_file")"
          echo "- ssh 版本: $(ssh -V 2>&1)"

          # 与原 action 保持一致：把 dist 目录里的内容同步到站点根目录
          printf 'put -r ./src/.vuepress/dist %s\n' "$DEPLOY_PATH" > "$batch_file"

          file_count=$(find ./src/.vuepress/dist -type f | wc -l)
          echo "- 待上传文件数: $file_count"

          # ---- 诊断：TCP 连通性 ----
          echo "### TCP 连通性探测 ($DEPLOY_HOST:$DEPLOY_PORT)"
          if timeout 20 bash -c "exec 3<>/dev/tcp/$DEPLOY_HOST/$DEPLOY_PORT" 2>&1; then
            tcp_result="TCP_OK"
          else
            tcp_result="TCP_FAIL"
          fi
          echo "- TCP 结果: $tcp_result"

          # ---- 诊断：网站本身是否可达（用于区分「整台机器不通」还是「只有 SSH 不通」）----
          http_result=$(timeout 20 curl -sS -o /dev/null -w '%{http_code}' "https://note.zhaohs.cn/" 2>&1 || true)
          echo "- 站点 HTTP 探测: $http_result"

          # ---- 诊断：ssh 连接过程 ----
          # 注意：Actions 默认 shell 带 -e，诊断命令失败必须显式吞掉，
          # 否则会中断整个步骤（这正是之前 exit 255 的假象来源）
          echo "### SSH 连接过程"
          timeout 60 ssh -vv -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts" \
            -i "$key_file" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" true 2>&1 | tail -n 30 || true
          echo "### ssh 探测结束"

          # ---- 实际部署 ----
          echo "### SFTP 上传"
          # 关闭 errexit，否则 sftp 失败会直接中断脚本，拿不到退出码
          set +e
          sftp -b "$batch_file" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -i "$key_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" 2>&1 | tee "$RUNNER_TEMP/sftp.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "### sftp 退出码: $status"

          # 同步 workspace 副本
          cp "$diag_file" "$GITHUB_WORKSPACE/deploy-diagnostic.log" 2>/dev/null || true

          exit $status

      # 诊断日志以 artifact 形式留存：Actions 日志对未登录访客不可见，
      # 而公开仓库的 artifact 可以直接通过 API 下载查看。
      - name: Upload deploy diagnostic
        if: failure() || steps.deploy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostic
          path: |
            ${{ runner.temp }}/deploy-diagnostic.log
            ${{ github.workspace }}/deploy-diagnostic.log
          retention-days: 7
          if-no-files-found: warn

      # 同一份诊断再推到独立分支 ci-diagnostics：
      # 走 git 通道不受 GitHub API 限流影响，便于本地直接 fetch 查看。
      - name: Push deploy diagnostic to branch
        if: failure() || steps.deploy.outcome == 'failure'
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"

          # 兜底：优先用 runner.temp 里的那份
          if [ ! -f deploy-diagnostic.log ] && [ -f "$RUNNER_TEMP/deploy-diagnostic.log" ]; then
            cp "$RUNNER_TEMP/deploy-diagnostic.log" deploy-diagnostic.log
          fi

          if [ ! -f deploy-diagnostic.log ]; then
            echo "no diagnostic file, skip"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-diagnostics
          git add -f deploy-diagnostic.log
          git commit -m "ci: deploy diagnostic (run ${{ github.run_number }})" || exit 0
          git push --force origin ci-diagnostics
